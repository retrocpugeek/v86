<!doctype html>
<title>aarch64 example</title>

<script src="../build/libv86.js"></script>
<script>
"use strict";

// Boots an arm64 Linux on v86's aarch64 machine (QEMU "virt"-like, cortex-a53).
//
// Expects a buildroot qemu_aarch64_virt_defconfig build in images/aarch64/:
//   Image         the kernel (output/images/Image)
//   rootfs.ext4   the root filesystem, attached as virtio-blk (/dev/vda)
// and build/v86-a64.wasm (make build/v86-a64.wasm build/libv86.js).

window.onload = function()
{
    var emulator = window.emulator = new V86({
        arch: "aarch64",
        wasm_path: "../build/v86-a64.wasm",
        memory_size: 128 * 1024 * 1024,
        kernel: {
            url: "../images/aarch64/Image",
        },
        hda: {
            url: "../images/aarch64/rootfs.ext4",
            async: false,
        },
        cmdline: "rootwait root=/dev/vda console=ttyAMA0",
        serial_container: document.getElementById("serial"),
        autostart: true,
        disable_keyboard: true,
        disable_mouse: true,
    });

    emulator.add_listener("download-progress", function(e)
    {
        if(e.lengthComputable)
        {
            document.getElementById("status").textContent =
                "Downloading " + e.file_name + ": " + Math.round(e.loaded / e.total * 100) + "%";
        }
    });
    emulator.add_listener("emulator-ready", function()
    {
        document.getElementById("status").textContent = "Running (log in as root)";
    });
};
</script>

<p id="status">Loading ...</p>
<textarea id="serial" cols="100" rows="40" spellcheck="false"></textarea>
