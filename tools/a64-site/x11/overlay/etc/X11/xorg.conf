# X on v86's aarch64 machine: the simple framebuffer (/dev/fb0) and the two
# virtio-input devices, configured statically (there's no udev).
# Buildroot links with -z now (BR2_RELRO_FULL), so a module's symbols must
# be resolvable when it's loaded: load what the fbdev driver uses first.
Section "Module"
    Load "fbdevhw"
    Load "shadow"
    Load "shadowfb"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "InputDevice"
    Identifier "keyboard"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "tablet"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
EndSection

Section "Device"
    Identifier "fb"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "screen"
    Device "fb"
    DefaultDepth 24
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen "screen"
    InputDevice "keyboard" "CoreKeyboard"
    InputDevice "tablet" "CorePointer"
EndSection
